<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PitchIQ — My reports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/app.css?v=2">
    <link rel="stylesheet" href="player.css?v=2">
</head>
<body>

<header class="topbar">
    <a class="brand" href="../">PitchIQ <span>player</span></a>
    <div class="topbar-user">
        <span id="who" class="muted"></span>
        <button id="btn-signout" class="btn small ghost">Sign out</button>
    </div>
</header>

<main class="shell">
    <div id="config-slot"></div>
    <div id="loading" class="loading">Loading your reports</div>

    <section id="view-empty" class="hidden">
        <h1 style="margin-top:48px">Nothing published yet</h1>
        <p class="lede" id="empty-msg">
            Your coach hasn't published any match reports for you yet. They'll
            appear here as soon as they do.
        </p>
    </section>

    <section id="view-reports" class="hidden">
        <div class="player-head">
            <div class="player-badge" id="player-number">—</div>
            <div>
                <h1 id="player-name" style="margin-bottom:4px">My season</h1>
                <p class="muted" id="player-sub"></p>
            </div>
        </div>

        <section class="block">
            <h3>Season so far</h3>
            <div id="season-stats" class="stat-grid"></div>
        </section>

        <section class="block">
            <h3>Match by match</h3>
            <div id="match-list" class="card-list"></div>
        </section>
    </section>
</main>

<div id="toast" class="toast"></div>

<script type="module" src="player.js?v=2"></script>
</body>
</html>
