<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pass Truth Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* A film room is dark on purpose: judging a 6-pixel ball against grass is a
   contrast task, and a bright chrome around the frame poisons it. This page
   commits to one visual world and paints every ground explicitly, so it holds
   whatever the host is set to. */
:root{
  --ground:#0D1214; --panel:#141B1E; --raise:#1C2529; --line:#28343A;
  --muted:#8CA0A8; --dim:#5E7178; --text:#E6EFF1;
  --origin:#FFB238;      /* passer, and where the ball came from */
  --dest:#4CC9F0;        /* receiver, and where the ball went */
  --good:#5FD08A; --bad:#E2574C; --warn:#E0A83A;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --cond:'Barlow Condensed',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,sans-serif;
  --r:7px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--text);
  font-family:var(--body); font-size:14px; line-height:1.45;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
:focus-visible{outline:2px solid var(--dest); outline-offset:2px}
.lbl{
  font-family:var(--cond); font-weight:600; font-size:12px;
  letter-spacing:.11em; text-transform:uppercase; color:var(--muted);
}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ---- shell ---------------------------------------------------------- */
#app{display:grid; grid-template-rows:auto 1fr; height:100%}
.top{
  display:flex; align-items:center; gap:18px; padding:9px 16px;
  background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.brand{font-family:var(--cond); font-weight:700; font-size:19px; letter-spacing:.03em}
.brand span{color:var(--dim); font-weight:500}
.tc{font-family:var(--mono); font-size:18px; font-weight:700; letter-spacing:-.01em}
.tc small{font-size:11px; color:var(--dim); font-weight:400; margin-left:6px}
.top .sp{flex:1}
.pill{
  font-family:var(--cond); font-size:12px; letter-spacing:.08em;
  text-transform:uppercase; padding:3px 9px; border-radius:100px;
  border:1px solid var(--line); background:var(--raise); color:var(--muted);
}
.pill.on{color:var(--good); border-color:#2C4A3A}
.pill.off{color:var(--warn); border-color:#4A3E24}

.cols{
  display:grid; grid-template-columns:288px minmax(0,1fr) 300px;
  gap:1px; background:var(--line); min-height:0;
}
.col{background:var(--ground); min-height:0; display:flex; flex-direction:column}
.col.mid{background:#0A0E10}
.scroll{overflow-y:auto; overflow-x:hidden; min-height:0; flex:1}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:var(--line); border-radius:9px}
.sec{padding:13px 14px; border-bottom:1px solid var(--line)}
.sec h2{margin:0 0 10px; font:600 12px/1 var(--cond); letter-spacing:.11em;
        text-transform:uppercase; color:var(--muted)}

/* ---- viewer --------------------------------------------------------- */
.stage{flex:1; display:flex; align-items:center; justify-content:center;
       padding:12px; min-height:0}
.wrap{position:relative; width:100%; max-height:100%; aspect-ratio:1120/630;
      background:#000; border:1px solid var(--line); border-radius:var(--r);
      overflow:hidden}
.wrap img{display:block; width:100%; height:100%; object-fit:fill}
.wrap svg{position:absolute; inset:0; width:100%; height:100%}
.wrap.aim{cursor:crosshair}
.loupe{
  position:absolute; top:8px; right:8px; width:188px; height:188px;
  border:1px solid var(--line); border-radius:var(--r); background:#000;
  display:none; pointer-events:none; box-shadow:0 6px 22px rgba(0,0,0,.6);
}
.loupe.flip{right:auto; left:8px}
.wrap.aim .loupe.live{display:block}
.loupe canvas{display:block; width:100%; height:100%; border-radius:var(--r)}
.hint{
  position:absolute; left:8px; bottom:8px; padding:5px 11px; border-radius:100px;
  background:rgba(13,18,20,.88); border:1px solid var(--line);
  font-family:var(--cond); font-size:13px; letter-spacing:.06em;
  text-transform:uppercase; pointer-events:none;
}
.hint b{color:var(--origin); font-weight:700}
.hint b.d{color:var(--dest)}
.load{position:absolute; inset:0; display:grid; place-content:center; gap:11px;
      background:var(--ground); text-align:center; padding:20px}
.bar{height:6px; background:var(--raise); border-radius:6px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--dest); border-radius:6px;
       transition:width .18s ease}
.load .bar{width:260px}

/* ---- transport + timeline ------------------------------------------- */
.trans{display:flex; align-items:center; gap:6px; padding:0 14px 8px; flex-wrap:wrap}
.btn{
  padding:5px 11px; border-radius:var(--r); border:1px solid var(--line);
  background:var(--raise); font-family:var(--cond); font-size:13px;
  letter-spacing:.06em; text-transform:uppercase; white-space:nowrap;
}
.btn:hover{border-color:var(--dim)}
.btn.in{color:var(--origin)} .btn.out{color:var(--dest)}
.btn.go{background:var(--good); color:#07130D; border-color:var(--good); font-weight:700}
.btn.go[disabled]{background:var(--raise); color:var(--dim); border-color:var(--line);
                  cursor:not-allowed; font-weight:600}
/* The one button that always names the next thing to do. Setting the two
   frames was a keystroke and a button buried seventh in this row; on a
   touch screen neither is findable, so it leads instead. */
.btn.prime{min-height:38px; padding:5px 15px; font-weight:700; font-size:14px;
           border-width:1px; color:#07130D}
.btn.prime[data-c="o"]{background:var(--origin); border-color:var(--origin)}
.btn.prime[data-c="d"]{background:var(--dest); border-color:var(--dest)}
.btn.prime[disabled]{background:none; font-weight:600; cursor:default}
.btn.prime[disabled][data-c="o"]{color:var(--origin); border-color:#4A3A18}
.btn.prime[disabled][data-c="d"]{color:var(--dest); border-color:#1C4152}
.btn.qui{background:none; color:var(--muted)}
.btn.sm{padding:3px 8px; font-size:12px}
kbd{font-family:var(--mono); font-size:10px; color:var(--dim); margin-left:5px}

.tl{padding:0 14px 12px}
.track{
  position:relative; height:58px; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
  cursor:pointer; user-select:none;
}
/* Chunks arrive in order, so what has loaded is always a prefix of the
   clip -- the fill says how far along the timeline is scrubbable yet. */
.got{position:absolute; left:0; top:0; bottom:0; background:#182226;
     border-right:1px solid #223035; pointer-events:none}
.track.done .got{display:none}
.track .tick{position:absolute; top:0; bottom:0; width:1px; background:#1F292E}
.track .tlab{position:absolute; bottom:2px; font-family:var(--mono); font-size:9px;
             color:var(--dim); transform:translateX(3px)}
.span{position:absolute; height:12px; border-radius:3px;
      background:linear-gradient(90deg,var(--origin),var(--dest)); opacity:.85}
.span.draft{background:repeating-linear-gradient(45deg,var(--warn),var(--warn) 5px,#8A6620 5px,#8A6620 10px)}
.head{position:absolute; top:0; bottom:0; width:2px; background:#fff;
      box-shadow:0 0 7px rgba(255,255,255,.55); pointer-events:none}

/* ---- checklist ------------------------------------------------------ */
.step{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:7px 9px; border-radius:var(--r); border:1px solid transparent;
  background:var(--panel); margin-bottom:5px;
}
.step:hover{border-color:var(--line)}
.step.act{border-color:var(--dest); background:var(--raise)}
.step .dot{width:9px; height:9px; border-radius:50%; background:var(--line); flex:none}
.step.done .dot{background:var(--good)}
.step[data-c="o"] .dot.set{background:var(--origin)}
.step[data-c="d"] .dot.set{background:var(--dest)}
.step .nm{flex:1; font-size:13px}
.step .vl{font-family:var(--mono); font-size:11px; color:var(--dim)}
.step.done .vl{color:var(--muted)}

.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{
  padding:4px 10px; border-radius:100px; border:1px solid var(--line);
  background:var(--panel); font-family:var(--cond); font-size:13px;
  letter-spacing:.05em; text-transform:uppercase;
}
.chip.sel{background:var(--raise); border-color:var(--dest); color:var(--dest)}
.chip.sel[data-v="dark"]{border-color:var(--muted); color:var(--text); background:#2A353A}
.chip.sel[data-v="light"]{border-color:#D8E4E8; color:#0D1214; background:#D8E4E8}
.chip.sel[data-v="completed"]{border-color:var(--good); color:var(--good)}
.chip.sel[data-v="incomplete"]{border-color:var(--bad); color:var(--bad)}
.chip.sel[data-v="unsure"]{border-color:var(--warn); color:var(--warn)}
textarea{
  width:100%; background:var(--panel); color:var(--text); resize:vertical;
  border:1px solid var(--line); border-radius:var(--r); padding:7px 9px;
  font-family:var(--body); font-size:13px; min-height:52px;
}
textarea:focus{border-color:var(--dest); outline:none}

/* ---- ledger --------------------------------------------------------- */
.row{
  display:grid; grid-template-columns:22px 1fr auto; gap:8px; align-items:center;
  padding:7px 9px; border-radius:var(--r); background:var(--panel);
  margin-bottom:5px; border:1px solid transparent;
}
.row:hover{border-color:var(--line)}
.row .n{font-family:var(--mono); font-size:11px; color:var(--dim)}
.row .t{font-family:var(--mono); font-size:12px}
.row .m{font-family:var(--cond); font-size:11px; letter-spacing:.07em;
        text-transform:uppercase; color:var(--dim)}
.row .del{color:var(--dim); font-size:15px; line-height:1; padding:2px 5px}
.row .del:hover{color:var(--bad)}
.stat{margin-bottom:9px}
.stat .hd{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px}
.stat .hd span:first-child{font-family:var(--cond); font-size:12px; letter-spacing:.08em;
                           text-transform:uppercase; color:var(--muted)}
.stat .hd span:last-child{font-family:var(--mono); font-size:12px}
.sbar{height:8px; background:var(--raise); border-radius:8px; overflow:hidden; display:flex}
.sbar i{height:100%; display:block}
.big{font-family:var(--mono); font-size:30px; font-weight:700; line-height:1}
.big small{font-family:var(--cond); font-size:12px; letter-spacing:.09em;
           text-transform:uppercase; color:var(--muted); margin-left:7px; font-weight:600}
.empty{color:var(--dim); font-size:13px; padding:5px 0}

@media (max-width:1100px){
  body{overflow:auto}
  #app{height:auto}
  .cols{grid-template-columns:1fr}
  .scroll{overflow:visible}
  .wrap{max-height:none}
  .btn.prime{flex:1 0 100%; min-height:46px}
}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand">Pass Truth Bench <span id="brandWin"></span></div>
    <div class="tc" id="tc"><span id="tcv"></span><small id="fno"></small></div>
    <div class="sp"></div>
    <div class="pill" id="saveState">local only</div>
    <div class="pill" id="countPill">0 passes</div>
  </div>

  <div class="cols">
    <!-- ============ capture rail ============ -->
    <div class="col">
      <div class="scroll">
        <div class="sec">
          <h2>Mark a pass</h2>
          <div id="steps"></div>
        </div>
        <div class="sec">
          <h2>Passing team</h2>
          <div class="chips" id="teamChips"></div>
        </div>
        <div class="sec">
          <h2>Outcome</h2>
          <div class="chips" id="outChips"></div>
        </div>
        <div class="sec">
          <h2>Note <span style="color:var(--dim);text-transform:none;letter-spacing:0">optional</span></h2>
          <textarea id="note" placeholder="e.g. deflected off a defender"></textarea>
        </div>
        <div class="sec" style="display:flex; gap:7px">
          <button class="btn go" id="save" disabled>Save pass <kbd>&#9166;</kbd></button>
          <button class="btn qui" id="clear">Clear</button>
        </div>
      </div>
    </div>

    <!-- ============ viewer ============ -->
    <div class="col mid">
      <div class="stage">
        <div class="wrap" id="wrap">
          <img id="fr" alt="match frame">
          <svg id="ov" viewBox="0 0 1120 630" preserveAspectRatio="none"></svg>
          <div class="loupe" id="loupe"><canvas id="lcv" width="188" height="188"></canvas></div>
          <div class="hint" id="hint"></div>
          <div class="load" id="load">
            <div class="lbl" id="llbl">Loading frames</div>
            <div class="bar"><i id="lbar" style="width:0%"></i></div>
            <div class="mono" style="font-size:12px;color:var(--dim)" id="ltxt">starting</div>
          </div>
        </div>
      </div>
      <div class="trans">
        <button class="btn prime" id="prime" data-c="o">Mark a pass here</button>
        <button class="btn" data-step="-10">&#171; 10</button>
        <button class="btn" data-step="-1">&#8249; 1<kbd>&#8592;</kbd></button>
        <button class="btn" id="play">Play<kbd>space</kbd></button>
        <button class="btn" data-step="1">1 &#8250;<kbd>&#8594;</kbd></button>
        <button class="btn" data-step="10">10 &#187;</button>
        <span style="width:10px"></span>
        <span class="sp" style="flex:1"></span>
        <span class="lbl" id="rate">1&times;</span>
        <button class="btn sm" data-rate="0.25">&frac14;&times;</button>
        <button class="btn sm" data-rate="0.5">&frac12;&times;</button>
        <button class="btn sm" data-rate="1">1&times;</button>
      </div>
      <div class="tl"><div class="track" id="track"><i class="got" id="got"></i><div class="head" id="head"></div></div></div>
    </div>

    <!-- ============ ledger ============ -->
    <div class="col">
      <div class="scroll">
        <div class="sec">
          <h2>Recorded</h2>
          <div class="big"><span id="cN">0</span><small id="cUnit">passes</small></div>
        </div>
        <div class="sec">
          <h2>By team</h2>
          <div id="byTeam"></div>
        </div>
        <div class="sec">
          <h2>By outcome</h2>
          <div id="byOut"></div>
        </div>
        <div class="sec">
          <h2>Ball in flight</h2>
          <div id="byTime"></div>
        </div>
        <div class="sec">
          <h2>The list</h2>
          <div id="list"><div class="empty">Nothing recorded yet.</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

const N = META.count, FPS = META.fps, T0 = META.start_s, VW = META.w, VH = META.h;

/* ---------- time ---------- */
const tOf = i => T0 + i / FPS;
function hms(t){
  const h = Math.floor(t/3600), m = Math.floor(t/60)%60, s = Math.floor(t)%60;
  const cs = Math.round((t - Math.floor(t))*100);
  return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')
         +'.'+String(cs===100?99:cs).padStart(2,'0');

const clamp = (v,a,b) => v<a?a:(v>b?b:v);

/* ---------- frame store ---------- */
const urls = new Array(N).fill(null);
let ready = 0;

async function loadFrames(){
  const bar = document.getElementById('lbar'), txt = document.getElementById('ltxt');
  const chunks = Math.max(...META.index.map(e => e[0])) + 1;
  let done = 0, total = 0;
  for (const [c,o,l] of META.index) total += l;
  for (let c = 0; c < chunks; c++){
    /* The asset store, not the published files: a full minute is ~119 MB and a
       published version caps at 64 MB. Each blob is many JPEGs end to end,
       sliced apart by the byte index. */
    const res = await fetch(META.blobs[c]);
    if (!res.ok) throw new Error('chunk ' + c + ' failed: ' + res.status);
    const buf = await res.arrayBuffer();
    for (let i = 0; i < N; i++){
      const e = META.index[i];
      if (e[0] !== c) continue;
      urls[i] = URL.createObjectURL(
        new Blob([buf.slice(e[1], e[1] + e[2])], {type:'image/jpeg'}));
      ready++; done += e[2];
    }
    bar.style.width = (100*done/total).toFixed(1) + '%';
    document.getElementById('got').style.width = (100*ready/N).toFixed(1) + '%';
    txt.textContent = (done/1e6).toFixed(0) + ' of ' + (total/1e6).toFixed(0) + ' MB';
    if (c === 0) { document.getElementById('load').style.display = 'none'; show(0); }
  }

  document.getElementById('track').classList.add('done');
}

function show(i){
  i = clamp(Math.round(i), 0, N-1);
  if (!urls[i]) {
    /* Scrubbed past what has downloaded. Refusing silently just looks broken,
       so name the reason and leave the viewer where it was. */
    const t = document.getElementById('tcv');
    t.textContent = 'still loading…';
    setTimeout(() => { if (t.textContent === 'still loading…')
                         t.textContent = hms(tOf(cur)); }, 900);
    return;
  }
  cur = i;
  img.src = urls[i];
  document.getElementById('tcv').textContent = hms(tOf(i));
  document.getElementById('fno').textContent = 'frame ' + i + ' / ' + (N-1);
  document.getElementById('head').style.left = (100*i/(N-1)) + '%';
  drawOverlay();
}
function step(d){ stop(); show(cur + d); }

/* ---------- playback ---------- */

function stop(){ if (timer) { clearInterval(timer); timer = null; }
                 document.getElementById('play').textContent = 'Play'; }
function play(){
  if (timer) return stop();
  document.getElementById('play').textContent = 'Pause';
  timer = setInterval(() => {
    if (cur >= N-1 || !urls[cur+1]) return stop();
    show(cur+1);
  }, 1000/(FPS*rate));

  const r = wrap.getBoundingClientRect();
  draft[s.k] = {x:(e.clientX - r.left)/r.width*VW,
                y:(e.clientY - r.top)/r.height*VH, f:cur};
  if (s.c === 'o' && !isSet('relFrame')) draft.relFrame = cur;
  if (s.c === 'd' && !isSet('arrFrame')) draft.arrFrame = cur;
  advance();
});

/* ---------- loupe ---------- */
const loupe = document.getElementById('loupe'), lcv = document.getElementById('lcv');
const lctx = lcv.getContext ? lcv.getContext('2d') : null;
if (lctx) lctx.imageSmoothingEnabled = false;
wrap.addEventListener('mousemove', e => {
  if (!lctx || !wrap.classList.contains('aim')) return;
  const r = wrap.getBoundingClientRect();
  const fx = (e.clientX - r.left)/r.width, fy = (e.clientY - r.top)/r.height;
  loupe.classList.add('live');
  loupe.classList.toggle('flip', fx > .62 && fy < .42);
  const SRC = 47;                       /* 47px of source -> 188px = 4x */
  try{
    lctx.fillStyle = '#000'; lctx.fillRect(0,0,188,188);
    lctx.drawImage(img, fx*VW - SRC/2, fy*VH - SRC/2, SRC, SRC, 0, 0, 188, 188);
    lctx.strokeStyle = 'rgba(255,255,255,.8)'; lctx.lineWidth = 1;
    lctx.beginPath(); lctx.moveTo(94,80); lctx.lineTo(94,108);
    lctx.moveTo(80,94); lctx.lineTo(108,94); lctx.stroke();
  }catch(_){}
});
wrap.addEventListener('mouseleave', () => loupe.classList.remove('live'));

/* ---------- overlay ---------- */
function mark(p, colour, label, ring){
  if (!p) return '';
  const on = p.f === cur, o = on ? 1 : .28;
  return '<g opacity="' + o + '">'
    + (ring ? '<circle cx="'+p.x+'" cy="'+p.y+'" r="17" fill="none" stroke="'+colour+'" stroke-width="2.5"/>'
            : '<path d="M'+(p.x-11)+' '+p.y+'h22M'+p.x+' '+(p.y-11)+'v22" stroke="'+colour+'" stroke-width="2.5"/>'
              +'<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="'+colour+'"/>')
    + '<text x="'+(p.x+21)+'" y="'+(p.y+4)+'" fill="'+colour
    + '" font-family="Barlow Condensed" font-size="17" font-weight="600">'+label+'</text></g>';
}
function drawOverlay(){
  const g = [];
  if (draft.ballFrom && draft.ballTo)
    g.push('<line x1="'+draft.ballFrom.x+'" y1="'+draft.ballFrom.y+'" x2="'+draft.ballTo.x
         +'" y2="'+draft.ballTo.y+'" stroke="#9BD9E8" stroke-width="2" stroke-dasharray="7 5" opacity=".75"/>');
  g.push(mark(draft.passer,   'var(--origin)', 'PASSER',   false));
  g.push(mark(draft.ballFrom, 'var(--origin)', 'BALL',     true));
  g.push(mark(draft.ballTo,   'var(--dest)',   'BALL',     true));
  g.push(mark(draft.receiver, 'var(--dest)',   'RECEIVER', false));
  document.getElementById('ov').innerHTML = g.join('');
}

/* ---------- timeline ---------- */
const track = document.getElementById('track');
function drawTrack(){
  [...track.querySelectorAll('.tick,.tlab,.span')].forEach(n => n.remove());
  const lab = WIN > 30 ? 5 : 2;
  for (let s = 0; s <= Math.ceil(WIN); s++){
    const L = 100*(s*FPS)/(N-1);
    if (L > 100) break;
    const d = document.createElement('div');
    d.className = 'tick'; d.style.left = L + '%'; track.appendChild(d);
    if (s % lab === 0){
      const t = document.createElement('div');
      t.className = 'tlab'; t.style.left = L + '%';
      t.textContent = hms(T0 + s).slice(2,7); track.appendChild(t);
    }
  }
  const lanes = [];
  passes.forEach(p => {
    let lane = 0;
    while (lanes[lane] !== undefined && lanes[lane] >= p.relFrame) lane++;
    lanes[lane] = p.arrFrame;
    const d = document.createElement('div');
    d.className = 'span';
    d.style.left = (100*p.relFrame/(N-1)) + '%';
    d.style.width = Math.max(.6, 100*(p.arrFrame - p.relFrame)/(N-1)) + '%';
    d.style.top = (3 + lane*14) + 'px';
    d.title = hms(tOf(p.relFrame)) + ' → ' + hms(tOf(p.arrFrame));
    track.appendChild(d);
  });
  if (isSet('relFrame')){
    const a = draft.relFrame, b = isSet('arrFrame') ? draft.arrFrame : draft.relFrame;
    const d = document.createElement('div');
    d.className = 'span draft';
    d.style.left = (100*Math.min(a,b)/(N-1)) + '%';
    d.style.width = Math.max(.6, 100*Math.abs(b-a)/(N-1)) + '%';
    d.style.bottom = '3px';
    track.appendChild(d);
  }
}
function seekFromEvent(e){
  const r = track.getBoundingClientRect();
  show(Math.round(clamp((e.clientX - r.left)/r.width, 0, 1) * (N-1)));
}
let dragging = false;
track.addEventListener('pointerdown', e => { dragging = true; stop();
  track.setPointerCapture(e.pointerId); seekFromEvent(e); });
track.addEventListener('pointermove', e => { if (dragging) seekFromEvent(e); });
track.addEventListener('pointerup', () => dragging = false);

/* ---------- chips ---------- */
function chips(host, key, opts){
  const el = document.getElementById(host);
  el.innerHTML = '';
  for (const [v, t] of opts){
    const b = document.createElement('button');
    b.className = 'chip' + (draft[key] === v ? ' sel' : '');
    b.dataset.v = v; b.dataset.key = key; b.textContent = t;
    b.addEventListener('click', () => {
      draft[key] = draft[key] === v ? null : v;
      renderChips(); renderSteps();
    });
    el.appendChild(b);
  }
}
function renderChips(){
  chips('teamChips','team',[['dark','Dark kit'],['light','Light kit'],['unsure',"Can't tell"]]);
  chips('outChips','outcome',[['completed','Completed'],['incomplete','Incomplete'],['unsure',"Can't tell"]]);
}

/* ---------- saving ---------- */
let db = null;
function nextId(){
  let n = 1;
  const used = new Set(passes.map(p => p.id));
  while (used.has('p' + n)) n++;
  return 'p' + n;
}
async function savePass(){
  if (!complete()) return;
  const p = JSON.parse(JSON.stringify(draft));
  p.note = document.getElementById('note').value.trim();
  p.id = nextId();
  p.t_release = +tOf(p.relFrame).toFixed(3);
  p.t_arrival = +tOf(p.arrFrame).toFixed(3);
  p.video = {w:VW, h:VH};
  p.at = new Date().toISOString();
  passes.push(p);
  passes.sort((a,b) => a.relFrame - b.relFrame);
  draft = blank(); active = 'relFrame';
  document.getElementById('note').value = '';
  persist(); renderAll();
  if (db) { try { await db.doc('truth/' + p.id).set(p); mark_saved(); }
            catch(_) { mark_saved('local only'); } }
}
async function removePass(id){
  passes = passes.filter(p => p.id !== id);
  persist(); renderAll();
  if (db) { try { await db.doc('truth/' + id).delete(); } catch(_){} }
}
function persist(){
  try { localStorage.setItem(LS, JSON.stringify(passes)); } catch(_){}
}
function mark_saved(txt){
  const el = document.getElementById('saveState');
  el.textContent = txt || 'saved for Claude';
  el.className = 'pill ' + (txt ? 'off' : 'on');
}

/* ---------- ledger + stats ---------- */
/* Rows are [label, value, colour, displayOverride]: the bar is drawn from the
   raw value and only the caption is rounded, so a 0.67 s total never renders as
   a 0.7 s bar. */
function statBar(host, rows, total){
  const el = document.getElementById(host);
  el.innerHTML = rows.map(([nm, n, col, disp]) =>
    '<div class="stat"><div class="hd"><span>' + nm + '</span><span>'
    + (disp === undefined ? n : disp) + '</span></div>'
    + '<div class="sbar"><i style="width:' + (total ? 100*n/total : 0)
    + '%;background:' + col + '"></i></div></div>').join('');
}
function renderList(){
  const el = document.getElementById('list');
  if (!passes.length){ el.innerHTML = '<div class="empty">Nothing recorded yet.</div>'; return; }
  el.innerHTML = '';
  passes.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = '<span class="n">' + (i+1) + '</span>'
      + '<span><span class="t">' + hms(tOf(p.relFrame)).slice(2) + '</span> '
      + '<span class="m">' + p.team + ' &middot; ' + p.outcome + ' &middot; '
      + ((p.arrFrame - p.relFrame)/FPS).toFixed(2) + 's</span></span>'
      + '<button class="del" title="Remove">&times;</button>';
    d.querySelector('.del').addEventListener('click', ev => {
      ev.stopPropagation(); removePass(p.id);
    });
    d.addEventListener('click', () => show(p.relFrame));
    el.appendChild(d);
  });
}
function renderAll(){
  const n = passes.length;
  document.getElementById('cN').textContent = n;
  document.getElementById('countPill').textContent = n + (n === 1 ? ' pass' : ' passes');
  const cnt = k => v => passes.filter(p => p[k] === v).length;
  statBar('byTeam', [['Dark', cnt('team')('dark'), 'var(--text)'],
                     ['Light', cnt('team')('light'), '#D8E4E8'],
                     ["Can't tell", cnt('team')('unsure'), 'var(--dim)']], n);
  statBar('byOut', [['Completed', cnt('outcome')('completed'), 'var(--good)'],
                    ['Incomplete', cnt('outcome')('incomplete'), 'var(--bad)'],
                    ["Can't tell", cnt('outcome')('unsure'), 'var(--warn)']], n);
  const flight = passes.reduce((s,p) => s + (p.arrFrame - p.relFrame)/FPS, 0);
  statBar('byTime', [['Seconds in flight', flight, 'var(--dest)', flight.toFixed(2)],
                     ['Window', WIN, 'var(--raise)', WIN.toFixed(2)]], WIN);
  renderList(); renderSteps(); drawTrack();
}

/* ---------- keys ---------- */
addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === ',') { step(e.shiftKey ? -10 : -1); e.preventDefault(); }
  else if (k === 'arrowright' || k === '.') { step(e.shiftKey ? 10 : 1); e.preventDefault(); }
  else if (k === ' ') { play(); e.preventDefault(); }
  else if (k === 'i') { draft.relFrame = cur; advance(); }
  else if (k === 'o') { draft.arrFrame = cur; advance(); }
  else if (k === 'enter') savePass();
  else if (k === 'escape') { draft = blank(); active = 'relFrame';
                             document.getElementById('note').value = ''; renderAll(); }
});
document.querySelectorAll('[data-step]').forEach(b =>
  b.addEventListener('click', () => step(+b.dataset.step)));
document.querySelectorAll('[data-rate]').forEach(b =>
  b.addEventListener('click', () => {
    rate = +b.dataset.rate;
    document.getElementById('rate').textContent = rate + '×';
    if (timer) { stop(); play(); }
  }));
document.getElementById('play').addEventListener('click', play);
document.getElementById('prime').addEventListener('click', () => {
  const s = STEPS.find(x => x.k === active);
  if (!s || s.kind !== 'frame') return;
  draft[s.k] = cur; advance();
});
document.getElementById('save').addEventListener('click', savePass);
document.getElementById('clear').addEventListener('click', () => {
  draft = blank(); active = 'relFrame';
  document.getElementById('note').value = ''; renderAll();
});

/* ---------- boot ---------- */
try {
  const raw = localStorage.getItem(LS);
  if (raw) passes = JSON.parse(raw) || [];
} catch(_) { passes = []; }
/* Fill the labels the markup no longer hardcodes. */
document.getElementById('brandWin').innerHTML =
  '· ' + hms(T0).slice(0, -3) + '–' + hms(T0 + WIN).slice(0, -3);
document.getElementById('tcv').textContent = hms(T0);
document.getElementById('fno').textContent = 'frame 0 / ' + (N - 1);
document.getElementById('llbl').textContent = 'Loading ' + N + ' frames';
document.getElementById('cUnit').textContent = 'passes in ' + Math.round(WIN) + ' s';

renderChips(); renderAll();
loadFrames().catch(e => {
  document.getElementById('ltxt').textContent = 'could not load frames: ' + e.message;
});

/* The store is opened after first paint, never before it: a page that waits on
   a capability to render is a page that shows nothing when the capability is
   not there. Local answers are kept either way. */
(async () => {
  try {
    db = await (window.claude && window.claude.use ? window.claude.use('db') : null);
  } catch(_) { db = null; }
  if (!db) { mark_saved('local only'); return; }
  mark_saved();
  try {
    const snap = await db.collection('truth').get();
    const remote = snap.docs.map(d => d.data()).filter(Boolean);
    if (remote.length && !passes.length){
      passes = remote.sort((a,b) => a.relFrame - b.relFrame);
      persist(); renderAll();
    } else if (passes.length){
      for (const p of passes) { try { await db.doc('truth/' + p.id).set(p); } catch(_){} }
    }
  } catch(_) { mark_saved('local only'); }
})();
</script>
