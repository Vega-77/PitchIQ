# Run the tests. There are three suites and none of them ran on push until now.
#
# The Python half installs requirements-test.txt rather than requirements.txt —
# `cv/detector.py` imports ultralytics lazily, so nothing under test pulls in
# torch, and the install is seconds rather than minutes. See that file for why.
#
# The emulator suite needs a JVM, which `firebase emulators:exec` starts for
# Firestore. That is the slow job; it runs in parallel with the others rather
# than after them, so a broken rule and a broken pipeline are both reported on
# the same run instead of one hiding the other.

name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A second push while the first is still running makes the first irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the venv this project is developed in.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - run: pip install -r requirements-test.txt

      # opencv-python needs libGL, which the runner image does not carry.
      # cv2 is imported by cv/pipeline.py, so this is not optional.
      - name: Install the OpenCV runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - run: python -m pytest tests/ -q

      # Not a linter for style — pyflakes only reports things that are wrong,
      # which makes it worth failing a build over.
      - run: python -m pyflakes cv/ tests/

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The pure suite imports only dependency-free modules, so it needs no
      # install at all — which is the property that keeps it fast enough to run
      # on every save locally.
      - run: node --test tests/video.test.js

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      - name: Run the emulator suite
        run: >
          npx firebase emulators:exec --only firestore --project pitchiq-test
          "node --test tests/rules.test.js tests/flow.test.js tests/onboarding.test.js"
