# Weekly update pull requests. Each one runs the Tests workflow like any other
# pull request; a version bump is merged only when that is green.
#
# pip reads pyproject.toml and the requirements files at the root. Every pin
# is exact, so a bump is a deliberate, tested change rather than drift, and
# test_requirements fails if the files stop agreeing on a version.

version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
