<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="There is no PitchIQ page at this address.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#13294b">
    <title>PitchIQ — page not found</title>
    <!-- GitHub Pages serves this file at whatever address was mistyped, so a
         relative link would resolve against that address. Everything here is
         rooted at the site (/PitchIQ/) or inline, and the script below fixes
         the home link for a copy published under another repository name. -->
    <link rel="icon" href="/PitchIQ/shared/icon.svg" type="image/svg+xml">
    <style>
        :root {
            --kit: #13294b;
            --kit-on: #ffffff;
            --kit-2: #f2b632;
            --bg: #f2f3f5;
            --surface: #ffffff;
            --line: #dfe3e8;
            --text: #141820;
            --text-dim: #434b5a;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Saira', system-ui, -apple-system, 'Segoe UI', sans-serif;
            line-height: 1.5;
        }
        header {
            background: var(--kit);
            color: var(--kit-on);
            padding: 14px 24px;
            font-family: 'Graduate', Georgia, serif;
            font-size: 1.3rem;
            border-bottom: 4px solid var(--kit-2);
        }
        main {
            max-width: 560px;
            margin: 56px auto;
            padding: 0 24px;
        }
        h1 {
            font-family: 'Saira Condensed', 'Saira', system-ui, sans-serif;
            font-weight: 800;
            font-size: 2.2rem;
            line-height: 1.1;
            margin: 0 0 12px;
        }
        p { color: var(--text-dim); margin: 0 0 24px; }
        a.home {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            background: var(--kit);
            color: var(--kit-on);
            font-weight: 600;
            text-decoration: none;
        }
        a.home:focus-visible { outline: 3px solid var(--kit-2); outline-offset: 2px; }
    </style>
</head>
<body>
<header>PitchIQ</header>
<main>
    <h1>No page here</h1>
    <p>Nothing lives at this address. It may have been mistyped, or the link
    may be out of date.</p>
    <a class="home" id="home" href="/PitchIQ/">Go to the PitchIQ home page</a>
</main>
<script>
    // On github.io a project site lives under its repository's name, the first
    // path segment; anywhere else the site is at the root.
    const repo = location.hostname.endsWith('github.io') ? location.pathname.split('/')[1] : '';
    document.getElementById('home').href = repo ? `/${repo}/` : '/';
</script>
</body>
</html>
